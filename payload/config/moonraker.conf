[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/klipper/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    127.0.0.1
    192.168.0.0/16
    100.64.0.0/10
cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz

[octoprint_compat]

[history]

[file_manager]
enable_object_processing: False

# 注意：电源设备要写成 [power_device <名字>]，没有 [power_devices] 这个组件
# （写了会报 "Unable to load component: (power_devices)" + Unparsed config section 警告）

[update_manager]
channel: stable
refresh_interval: 168
enable_auto_refresh: True
enable_system_updates: False
