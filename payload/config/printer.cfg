# ============================================================
#  Klipper 全家桶 —— 无打印主板时的验证配置
#
#  使用 Linux host MCU (klipper_mcu)：即使没接打印主板，
#  Klipper 也能真正进入 ready，便于验证整套系统
#  （Mainsail 网页 / KlipperScreen 触屏 / Moonraker API / G-code 通道）。
#
#  接上真实打印主板后，把下面 [mcu] 的 serial 改成主板串口，
#  并替换成对应机型的 printer.cfg 即可。
# ============================================================

[include mainsail.cfg]

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# 虚拟 SD 卡：网页/触屏可上传并"打印" G-code
[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]
[display_status]
[respond]

[idle_timeout]
timeout: 600

# H618 SoC 温度（Klipper 内建 host 传感器），用于验证温度链路与图表
[temperature_sensor SoC]
sensor_type: temperature_host
min_temp: 0
max_temp: 110

# ------------------------------------------------------------
# 常用宏：无硬件时用来验证 G-code 通道 / 界面按钮
# （宏名不能与 Klipper 内建命令重名，如 STATUS / RESTART 等）
# ------------------------------------------------------------
[gcode_macro MACHINE_STATUS]
description: 显示本机 Klipper 状态
gcode:
    {% set st = printer.print_stats.state %}
    RESPOND MSG="state={st} | kinematics={printer.configfile.settings.printer.kinematics}"
